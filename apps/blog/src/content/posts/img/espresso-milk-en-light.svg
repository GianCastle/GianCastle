<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img"><title>Milk temperature while steaming, air first up to 37 degrees and then a whirlpool up to 60 to 65</title><rect width="1200" height="700" fill="#dde8ee"/><rect x="0" y="0" width="600.0" height="8" fill="#f47b20"/><rect x="600.0" y="0" width="360.0" height="8" fill="#2bb3c0"/><rect x="960.0" y="0" width="240.0" height="8" fill="#ec5a8c"/><text x="56" y="70" font-size="14" fill="#3a4146" text-anchor="start" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >STEAMING THE MILK</text><g transform="rotate(-3 1057.1 62)"><rect x="970.2" y="40" width="173.79999999999998" height="40" fill="#ec5a8c"/><text x="1057.1" y="66" font-size="14" fill="#121416" text-anchor="middle" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >GENERAL GUIDE</text></g><rect x="150" y="120" width="950" height="60" fill="#ec5a8c" opacity="0.22"/><rect x="150" y="210" width="950" height="30" fill="#f47b20" opacity="0.45"/><text x="166" y="155" font-size="13" fill="#b02a5c" text-anchor="start" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >TOO FAR, LOSES SWEETNESS</text><text x="166" y="230.0" font-size="13" fill="#121416" text-anchor="start" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >SWEET, STOP HERE</text><line x1="150" y1="378" x2="1100" y2="378" stroke="#9aa7ae" stroke-width="2" stroke-dasharray="4 8"/><line x1="582" y1="120" x2="582" y2="600" stroke="#9aa7ae" stroke-width="3" stroke-dasharray="8 8"/><text x="136" y="575" font-size="13" fill="#3a4146" text-anchor="end" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >FRIDGE 5°</text><text x="136" y="383" font-size="13" fill="#3a4146" text-anchor="end" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >37°</text><text x="136" y="245" font-size="13" fill="#3a4146" text-anchor="end" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >60°</text><text x="136" y="215" font-size="13" fill="#3a4146" text-anchor="end" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >65°</text><text x="136" y="185" font-size="13" fill="#3a4146" text-anchor="end" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >70°</text><polyline points="960,210 1070,156" fill="none" stroke="#ec5a8c" stroke-width="6" stroke-dasharray="4 12" stroke-linecap="round"/><text x="1070" y="142" font-size="12" fill="#b02a5c" text-anchor="end" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >IF YOU KEEP GOING</text><polyline points="150,570 582,378" fill="none" stroke="#2bb3c0" stroke-width="9" stroke-linecap="round"/><polyline points="582,378 960,210" fill="none" stroke="#121416" stroke-width="9" stroke-linecap="round"/><circle cx="960" cy="210" r="13" fill="#f47b20" stroke="#dde8ee" stroke-width="4"/><line x1="150" y1="600" x2="1100" y2="600" stroke="#121416" stroke-width="4"/><text x="366.0" y="648" font-size="38" fill="#0d6e79" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-style="italic" font-weight="900">1 · AIR</text><text x="366.0" y="674" font-size="12" fill="#3a4146" text-anchor="middle" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >TIP AT THE SURFACE</text><text x="771.0" y="648" font-size="38" fill="#121416" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-style="italic" font-weight="900">2 · WHIRLPOOL</text><text x="771.0" y="674" font-size="12" fill="#3a4146" text-anchor="middle" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >TIP SUNK</text><text x="1100" y="648" font-size="13" fill="#3a4146" text-anchor="end" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1.6" >TIME →</text></svg>
